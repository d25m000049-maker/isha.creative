<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1200" width="1800" height="1200" role="img" aria-label="Decision flow: rider opens Maps, then cab app 1 by habit; if the fare is not acceptable, app 2, then app 3. Regular riders pick the best of three; irregular riders give up and hail a street auto."><rect width="1800" height="1200" fill="#0F1B2D"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9AA6B8"/></marker></defs><text x="60" y="70.0" font-size="30" fill="#F4EFE6" text-anchor="start" font-weight="600" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >Decision flow: how a single trip plays out today</text><rect x="520.0" y="110.0" width="760" height="80" rx="10" fill="#16263D" stroke="#3A4A63" stroke-width="2.5"/><text x="900" y="158.4" font-size="24" fill="#F4EFE6" text-anchor="middle" font-weight="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >Needs to travel: opens Google Maps, checks route &amp; ETA</text><path d="M900 190L900 250" stroke="#9AA6B8" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="690.0" y="253.0" width="420" height="74" rx="10" fill="#1B2C45" stroke="#E0A23A" stroke-width="2.5"/><text x="900" y="298.4" font-size="24" fill="#E0A23A" text-anchor="middle" font-weight="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >Needs a cab or bike?</text><path d="M690 290L520 290" stroke="#9AA6B8" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="605" y="276.0" font-size="18" fill="#9AA6B8" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >NO</text><rect x="190.0" y="253.0" width="320" height="74" rx="10" fill="none" stroke="#E8685A" stroke-width="2.5"/><text x="350" y="297.7" font-size="22" fill="#E8685A" text-anchor="middle" font-weight="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >Walks / own transport · END</text><path d="M900 327L900 400" stroke="#9AA6B8" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="925" y="370.0" font-size="18" fill="#9AA6B8" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >YES</text><rect x="690.0" y="403.0" width="420" height="74" rx="10" fill="#16263D" stroke="#3A4A63" stroke-width="2.5"/><text x="900" y="448.4" font-size="24" fill="#F4EFE6" text-anchor="middle" font-weight="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >Opens cab app #1 by habit</text><path d="M900 477L900 550" stroke="#9AA6B8" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="650.0" y="553.0" width="500" height="74" rx="10" fill="#1B2C45" stroke="#E0A23A" stroke-width="2.5"/><text x="900" y="598.4" font-size="24" fill="#E0A23A" text-anchor="middle" font-weight="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >Fare &amp; wait time acceptable?</text><path d="M650 590L520 590" stroke="#9AA6B8" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="585" y="576.0" font-size="18" fill="#9AA6B8" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >YES</text><rect x="190.0" y="553.0" width="320" height="74" rx="10" fill="none" stroke="#4CC3B0" stroke-width="2.5"/><text x="350" y="597.7" font-size="22" fill="#4CC3B0" text-anchor="middle" font-weight="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >Books &amp; pays in that app</text><path d="M900 627L900 700" stroke="#9AA6B8" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="925" y="670.0" font-size="18" fill="#9AA6B8" text-anchor="start" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >NO</text><rect x="670.0" y="703.0" width="460" height="74" rx="10" fill="#16263D" stroke="#3A4A63" stroke-width="2.5"/><text x="900" y="748.4" font-size="24" fill="#F4EFE6" text-anchor="middle" font-weight="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >Opens app #2, compares again</text><path d="M900 777L900 850" stroke="#9AA6B8" stroke-width="2.5" fill="none" marker-end="url(#a)"/><rect x="590.0" y="853.0" width="620" height="74" rx="10" fill="#1B2C45" stroke="#E0A23A" stroke-width="2.5"/><text x="900" y="898.4" font-size="24" fill="#E0A23A" text-anchor="middle" font-weight="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >Still not acceptable? Opens app #3, last comparison</text><path d="M900 927V980H500V1040M900 980H1300V1040" stroke="#9AA6B8" stroke-width="2.5" fill="none"/><path d="M500 1020L500 1046" stroke="#9AA6B8" stroke-width="2.5" fill="none" marker-end="url(#a)"/><path d="M1300 1020L1300 1046" stroke="#9AA6B8" stroke-width="2.5" fill="none" marker-end="url(#a)"/><text x="500" y="1008.0" font-size="17" fill="#9AA6B8" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" letter-spacing="2">REGULAR RIDER</text><text x="1300" y="1008.0" font-size="17" fill="#9AA6B8" text-anchor="middle" font-weight="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" letter-spacing="2">IRREGULAR RIDER</text><rect x="280.0" y="1060.0" width="440" height="80" rx="10" fill="none" stroke="#4CC3B0" stroke-width="2.5"/><text x="500" y="1108.0" font-size="23" fill="#4CC3B0" text-anchor="middle" font-weight="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >Picks the best of three, books</text><rect x="1020.0" y="1060.0" width="560" height="80" rx="10" fill="none" stroke="#E8685A" stroke-width="2.5"/><text x="1300" y="1093.4" font-size="22" fill="#E8685A" text-anchor="middle" font-weight="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >Gives up comparing, hails a</text><text x="1300" y="1122.0" font-size="22" fill="#E8685A" text-anchor="middle" font-weight="500" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" >street auto instead · END</text></svg>